services:
  db:
    image: postgres:16-alpine
    container_name: leav-postgres
    environment:
      POSTGRES_DB: leav
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - leav_pgdata:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  leav_pgdata: